<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIAM BOARD GAMES - I'm the Boss!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top-navbar">
  <div class="nav-left"><div class="logo"><span class="logo-siam">SIAM</span><span class="logo-sub">BOARD GAMES</span></div>
    <nav class="main-menu"><a href="#" class="active">เกมของฉัน</a><a href="#">สถิติ</a><a href="#">ชุมชน</a></nav></div>
  <div class="nav-right"><span id="roomTag" class="room-tag"></span>
    <div class="user-avatar"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Boss" alt="user"></div></div>
</header>

<div id="lobby" class="lobby"><div class="side-card lobby-box">
  <h1>I'm the BOSS!</h1><p class="sub">อย่ายอมให้บอสสั่ง</p>
  <input id="name" placeholder="ชื่อของคุณ" maxlength="14">
  <button class="btn-leave" id="btnCreate">สร้างห้อง</button>
  <div class="row"><input id="code" placeholder="รหัสห้อง" maxlength="4"><button class="btn-setting" id="btnJoin">เข้าร่วม</button></div>
  <p id="err" class="err"></p>
</div></div>

<div class="main-layout" id="game" hidden>
  <aside class="left-toolbar"><div class="tool-item user-item">👤</div><div class="tool-item red-card">🃏</div>
    <div class="tool-item icon-blue">$</div><div class="tool-item icon-yellow">$</div><div class="tool-item icon-green">👥</div></aside>

  <main class="board-viewport"><div class="board-wrapper">
    <div class="player-tabs" id="tabs"></div>
    <div class="board-3d">
      <div class="tiles-row" id="rowTop"></div>
      <div class="board-middle-row">
        <div class="side-col left-col" id="colL"></div>
        <div class="central-floor"><div class="stock-bg-overlay">
          <div class="boss-logo-banner"><h1>I'm the BOSS!</h1><p id="roundInfo">อย่ายอมให้บอสสั่ง</p></div>
          <div class="deal-cards-area">
            <div class="deck-box"><div class="deck-graphic">💼</div></div>
            <div class="active-deal-card"><div class="deal-header" id="dealNo">#-</div><div class="deal-amount" id="dealAmt">-</div><div class="deal-stacks" id="dealSeats"></div></div>
          </div>
          <div id="actionZone" class="action-zone"></div>
        </div></div>
        <div class="side-col right-col" id="colR"></div>
      </div>
      <div class="tiles-row" id="rowBot"></div>
    </div>
  </div></main>

  <aside class="right-sidebar">
    <div class="side-card"><div class="side-card-header"><span>ห้อง <b id="roomCode"></b></span><button class="btn-setting" id="btnStart" hidden>เริ่มเกม</button></div>
      <ul class="voice-users" id="plist"></ul></div>
    <div class="side-card"><div class="side-card-header"><span>การ์ดอิทธิพลของคุณ</span></div>
      <div class="preview-cards-container" id="hand"></div>
      <div class="deck-count" id="handHint">เลือกการ์ด แล้วเลือกเป้าหมาย</div></div>
    <div class="side-card chat-card"><div class="side-card-header"><span>บันทึก / แชท</span></div>
      <div id="log" class="logbox"></div>
      <div class="row"><input id="chatIn" placeholder="พิมพ์ข้อความต่อรอง..."><button class="btn-setting" id="btnChat">ส่ง</button></div></div>
  </aside>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
